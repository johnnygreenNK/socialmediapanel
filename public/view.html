<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social Panel</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }

    #loadingOverlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      background: #0d0d0d;
      z-index: 10;
      transition: opacity .3s ease, background .4s ease;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }

    .ov-ring {
      width: 44px; height: 44px;
      border: 3px solid rgba(78,127,255,.18);
      border-top-color: #4e7fff;
      border-radius: 50%;
      animation: ov-spin .85s linear infinite;
    }
    .ov-ring.white {
      border-color: rgba(255,255,255,.2);
      border-top-color: #fff;
    }
    @keyframes ov-spin { to { transform: rotate(360deg); } }

    .ov-gdots { display: flex; gap: 7px; }
    .ov-gdots span {
      width: 10px; height: 10px; border-radius: 50%;
      animation: ov-gdot 1.4s ease-in-out infinite both;
    }
    .ov-gdots span:nth-child(1) { background:#4285F4; animation-delay:-.32s; }
    .ov-gdots span:nth-child(2) { background:#EA4335; animation-delay:-.16s; }
    .ov-gdots span:nth-child(3) { background:#FBBC05; }
    .ov-gdots span:nth-child(4) { background:#34A853; animation-delay:.16s; }
    @keyframes ov-gdot {
      0%,80%,100% { transform:scale(.35); opacity:.3; }
      40%          { transform:scale(1);   opacity:1;  }
    }

    #overlay-status {
      font: 13px/1.4 system-ui, sans-serif;
      color: #5a6275;
      min-height: 1.3em;
      text-align: center;
    }
  </style>
</head>
<body class="view">
  <canvas id="screen"></canvas>

  <div id="loadingOverlay">
    <div class="ov-ring"></div>
    <div id="overlay-status"></div>
  </div>

  <script src="/viewer.js?v=3"></script>
  <script src="/view.js?v=3"></script>
</body>
</html>
